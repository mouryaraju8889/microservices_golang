apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  annotations:
    # nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - http:
      paths:
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: userservice
            port:
              number: 80
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: orderservice
            port:
              number: 80
