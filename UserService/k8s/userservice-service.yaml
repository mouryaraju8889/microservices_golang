apiVersion: v1
kind: Service
metadata:
  name: userservice
spec:
  selector:
    app: userservice  # Matches the deployment's label selector
  ports:
    - protocol: TCP
      port: 8080   # Port exposed by the service
      targetPort: 8080  # Port exposed by the container
  type: LoadBalancer  # This will expose the service externally (for Minikube)
